[project]
name = "ask-luma"
version = "0.1.0"
description = "Ask Luma + Driftline: a Q&A chatbot and the system that manages changes to its behavior"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "litellm>=1.55",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "markdownify>=0.14",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One venv for the whole monorepo. Every package is installed editable so the
# directory boundary between them stays real without four dependency files.
# apps/console cannot import apps/chatbot because there is nothing in ask_luma to
# import: the shared kernel is agent, and both apps depend on it downward.
#
# sources is written out rather than relying on the `packages` shorthand: with
# four source roots hatchling's inference collapses them to a common parent and
# the editable install stops resolving.
[tool.hatch.build.targets.wheel]
only-include = [
    "packages/behavior_core",
    "packages/agent",
    "apps/chatbot/src/ask_luma",
    "apps/console/src/driftline",
    "apps/server/src/server",
]

[tool.hatch.build.targets.wheel.sources]
"packages" = ""
"apps/chatbot/src" = ""
"apps/console/src" = ""
"apps/server/src" = ""
